# docker-compose.yml
# ---------------------------------------------------------------------------
# Sobe Postgres + TelemetryService juntos. Uso:
#   docker compose up --build
# O jogo (rodando fora do Docker, no editor Unity) conecta em localhost:50051.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  telemetry-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEMETRY_DSN: "dbname=telemetry user=postgres password=postgres host=postgres"
    ports:
      - "50051:50051"

volumes:
  pgdata:
